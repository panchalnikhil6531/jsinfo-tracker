<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; padding: 14px; font: 14px system-ui, sans-serif; color: #1d2330; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: block; font-size: 12px; color: #6b7385; margin-top: 8px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; margin-top: 2px; border: 1px solid #ccd; border-radius: 6px; font: inherit; }
    button { margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #f0b90b; font-weight: 600; cursor: pointer; }
    button.secondary { background: #e8eaf0; margin-top: 8px; }
    .msg { margin-top: 8px; font-size: 12px; min-height: 16px; }
    .err { color: #c0392b; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>JS.info Tracker Sync</h1>

  <form id="loginView">
    <label>Tracker URL <input id="url" placeholder="https://your-app.onrender.com" required></label>
    <label>Email <input id="email" type="email" required></label>
    <label>Password <input id="password" type="password" required></label>
    <button type="submit">Log in</button>
  </form>

  <div id="mainView" hidden>
    <p>Logged in as <b id="who"></b></p>
    <p class="msg" id="last"></p>
    <button id="open" class="secondary">Open my tracker</button>
    <button id="logout" class="secondary">Log out</button>
  </div>

  <p class="msg err" id="msg"></p>
  <script src="popup.js"></script>
</body>
</html>
