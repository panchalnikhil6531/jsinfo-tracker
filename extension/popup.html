<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="icons/icon48.png" alt="" width="36" height="36">
    <div>
      <div class="title">JS.info Tracker</div>
      <div class="subtitle" id="status">Not connected</div>
    </div>
    <span class="dot" id="dot" title="Connection status"></span>
  </header>

  <!-- Logged out -->
  <form id="loginView" class="card" novalidate>
    <label>Tracker URL
      <input id="url" type="url" placeholder="https://your-app.onrender.com" autocomplete="url" required>
    </label>
    <label>Email
      <input id="email" type="email" autocomplete="username" required>
    </label>
    <label>Password
      <span class="pw">
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="button" id="togglePw" class="ghost" aria-label="Show password">Show</button>
      </span>
    </label>
    <button type="submit" id="loginBtn" class="primary">Log in</button>
  </form>

  <!-- Logged in -->
  <div id="mainView" hidden>
    <section class="card">
      <div class="row">
        <span class="who">Hi, <b id="who"></b></span>
        <span class="pct" id="pct">0%</span>
      </div>
      <div class="bar"><div id="bar"></div></div>
      <div class="counts"><span id="doneCount">–</span><span id="learnCount"></span></div>
    </section>

    <section class="card now" id="nowCard" hidden>
      <div class="label">On this page</div>
      <div id="nowText"></div>
    </section>

    <section class="card last">
      <div class="label">Last sync</div>
      <div id="last">Open a javascript.info lesson to start tracking.</div>
    </section>

    <div class="actions">
      <button id="open" class="primary">Open tracker</button>
      <button id="logout" class="secondary">Log out</button>
    </div>
  </div>

  <p class="msg" id="msg" role="alert"></p>

  <script src="lessons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
